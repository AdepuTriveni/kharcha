[project]
name = "kharcha-backend"
version = "0.1.0"
description = "Kharcha backend workspace root (migrations, cross-package tests)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-ingest-api",
    "kharcha-processor",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "psycopg[binary]>=3.2",
    "litellm>=1.55",
    "jsonschema>=4.23",
    "types-jsonschema",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-ingest-api = { workspace = true }
kharcha-processor = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "S", "PT",
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DTZ001"]

[tool.ruff.lint.isort]
known-first-party = ["kharcha_common", "kharcha_ingest", "kharcha_processor"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "litellm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["."]
testpaths = ["packages", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (testcontainers) or local services such as Ollama",
]

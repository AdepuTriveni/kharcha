[project]
name = "kharcha-mcp-finance"
version = "0.1.0"
description = "Kharcha finance tools (PROJECT_SPEC §17.3); in-process now, MCP server in W13"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-agent-runtime",
    "kharcha-insights",
]

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-agent-runtime = { workspace = true }
kharcha-insights = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_mcp_finance"]

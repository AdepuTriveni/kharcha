[project]
name = "kharcha-agent-runtime"
version = "0.1.0"
description = "Kharcha agent runtime: loop, limits, tool permissions, grounding, transcripts, replay"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "litellm>=1.55",
    "pyyaml>=6.0",
    "tenacity>=9.0",
]

[tool.uv.sources]
kharcha-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_runtime"]

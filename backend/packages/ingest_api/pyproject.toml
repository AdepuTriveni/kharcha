[project]
name = "kharcha-ingest-api"
version = "0.1.0"
description = "Kharcha ingest API (phone uploads, Ask, bill photos, settings)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
kharcha-ingest = "kharcha_ingest.main:run"

[tool.uv.sources]
kharcha-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_ingest"]

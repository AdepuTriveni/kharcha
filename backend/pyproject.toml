[project]
name = "kharcha-backend"
version = "0.1.0"
description = "Kharcha backend workspace root (migrations, cross-package tests)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-ingest-api",
    "kharcha-processor",
    "kharcha-notifier",
    "kharcha-insights",
    "kharcha-agents",
    "kharcha-agent-runtime",
    "kharcha-mcp-finance",
    "kharcha-mcp-notify",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "hypothesis>=6.120",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.9",
    "psycopg[binary]>=3.2",
    "litellm>=1.55",
    "jsonschema>=4.23",
    "types-jsonschema",
    "fakeredis>=2.26",
    "types-pyyaml",
    "import-linter>=2.1",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-ingest-api = { workspace = true }
kharcha-processor = { workspace = true }
kharcha-notifier = { workspace = true }
kharcha-insights = { workspace = true }
kharcha-agents = { workspace = true }
kharcha-agent-runtime = { workspace = true }
kharcha-mcp-finance = { workspace = true }
kharcha-mcp-notify = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "DTZ", "T20", "SIM", "RUF", "ASYNC", "S", "PT",
]
ignore = [
    "S101",  # assert is fine in tests
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "DTZ001"]

[tool.ruff.lint.isort]
known-first-party = [
    "kharcha_common", "kharcha_ingest", "kharcha_processor", "kharcha_notifier", "kharcha_insights",
    "kharcha_agents", "kharcha_ml", "kharcha_runtime", "kharcha_mcp_finance", "kharcha_mcp_notify",
]

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["testcontainers.*", "litellm.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
pythonpath = ["."]
testpaths = ["packages", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: needs Docker (testcontainers) or local services such as Ollama",
]

# ---------------------------------------------------------------- import-linter (CLAUDE.md, §28.2)
[tool.importlinter]
root_packages = [
    "kharcha_common", "kharcha_ingest", "kharcha_processor", "kharcha_notifier",
    "kharcha_insights", "kharcha_agents", "kharcha_runtime", "kharcha_mcp_finance",
    "kharcha_mcp_notify",
]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Agent code and the runtime never touch the database (tools only)"
type = "forbidden"
source_modules = ["kharcha_agents.coach", "kharcha_runtime"]
forbidden_modules = ["kharcha_common.db", "sqlalchemy", "asyncpg"]
# The in-process executor opens a session for tool handlers; replaced by MCP clients in W13.
ignore_imports = ["kharcha_runtime.tools -> sqlalchemy"]

[[tool.importlinter.contracts]]
name = "kharcha_common is the bottom layer"
type = "forbidden"
source_modules = ["kharcha_common"]
forbidden_modules = [
    "kharcha_ingest", "kharcha_processor", "kharcha_notifier", "kharcha_insights",
    "kharcha_agents", "kharcha_runtime", "kharcha_mcp_finance", "kharcha_mcp_notify",
]

[[tool.importlinter.contracts]]
name = "Services do not import each other's internals"
type = "independence"
modules = ["kharcha_processor", "kharcha_notifier", "kharcha_ingest"]

[[tool.importlinter.contracts]]
name = "Tool servers never import agents or the notifier"
type = "forbidden"
source_modules = ["kharcha_mcp_finance", "kharcha_mcp_notify"]
forbidden_modules = ["kharcha_agents", "kharcha_notifier", "kharcha_ingest"]

[project]
name = "kharcha-agents"
version = "0.1.0"
description = "Kharcha agents: orchestrator, Coach, Cash Detective, Refund Advocate, Memory Keeper, Analyst; kharcha-eval CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-processor",
    # Shared parsing metrics (§15.5). kharcha-ml keeps heavy training deps optional.
    "kharcha-ml",
    "typer>=0.15",
]

[project.scripts]
kharcha-eval = "kharcha_agents.evals.cli:run"

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-processor = { workspace = true }
kharcha-ml = { path = "../../../ml", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_agents"]

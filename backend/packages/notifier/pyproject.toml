[project]
name = "kharcha-notifier"
version = "0.1.0"
description = "Kharcha notifier: policy gate, Telegram bot, daily summary, feedback"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "httpx>=0.28",
    "redis>=5.2",
    "litellm>=1.55",
]

[project.scripts]
kharcha-notifier = "kharcha_notifier.main:run"

[tool.uv.sources]
kharcha-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_notifier"]

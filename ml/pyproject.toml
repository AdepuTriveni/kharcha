[project]
name = "kharcha-ml"
version = "0.1.0"
description = "Kharcha ML: datasets, distillation, fine-tuning, evals, GGUF/ONNX export (ADR-014)"
requires-python = ">=3.12,<3.13"
# Heavy training deps (torch, transformers, peft, lightgbm, ...) are added in Phase 4/7.
dependencies = [
    "pydantic>=2.10",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_ml"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
addopts = "--import-mode=importlib --strict-markers"
testpaths = ["tests"]

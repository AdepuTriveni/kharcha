[project]
name = "kharcha-mcp-memory"
version = "0.1.0"
description = "Kharcha memory tools as an MCP server (PROJECT_SPEC §17.3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-agent-runtime",
    "kharcha-mcp-kit",
]

[project.scripts]
kharcha-mcp-memory = "kharcha_mcp_memory.server:run"

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-agent-runtime = { workspace = true }
kharcha-mcp-kit = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_mcp_memory"]

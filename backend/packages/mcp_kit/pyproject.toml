[project]
name = "kharcha-mcp-kit"
version = "0.1.0"
description = "Shared MCP plumbing: scoped service tokens, permission table, server builder, client executor (§17.3)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-agent-runtime",
    "mcp>=2.2",
    "pyjwt>=2.10",
    "uvicorn>=0.34",
]

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-agent-runtime = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_mcp_kit"]

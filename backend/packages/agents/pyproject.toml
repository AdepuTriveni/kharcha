[project]
name = "kharcha-agents"
version = "0.1.0"
description = "Kharcha agents: orchestrator, Coach, Cash Detective, Refund Advocate, Memory Keeper, Analyst; kharcha-eval CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "kharcha-processor",
    "kharcha-insights",
    "kharcha-agent-runtime",
    "kharcha-mcp-finance",
    "kharcha-mcp-notify",
    "kharcha-mcp-memory",
    "kharcha-mcp-refund",
    "kharcha-mcp-kit",
    "faststream[confluent]>=0.7",
    "prometheus-client>=0.21",
    # Shared parsing metrics (§15.5). kharcha-ml keeps heavy training deps optional.
    "kharcha-ml",
    "typer>=0.15",
]

[project.scripts]
kharcha-eval = "kharcha_agents.evals.cli:run"
kharcha-agents = "kharcha_agents.main:run"

[tool.uv.sources]
kharcha-common = { workspace = true }
kharcha-processor = { workspace = true }
kharcha-insights = { workspace = true }
kharcha-agent-runtime = { workspace = true }
kharcha-mcp-finance = { workspace = true }
kharcha-mcp-notify = { workspace = true }
kharcha-mcp-memory = { workspace = true }
kharcha-mcp-refund = { workspace = true }
kharcha-mcp-kit = { workspace = true }
kharcha-ml = { path = "../../../ml", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_agents"]

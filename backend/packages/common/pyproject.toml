[project]
name = "kharcha-common"
version = "0.1.0"
description = "Shared Kharcha code: Pydantic events, topics, money, time, DB base, settings"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "tzdata>=2024.2",  # zoneinfo data on Windows
    "faststream[confluent]>=0.7",
    "tenacity>=9.0",
    "prometheus-client>=0.21",
    "redis>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_common"]

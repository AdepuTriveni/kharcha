[project]
name = "kharcha-processor"
version = "0.1.0"
description = "Kharcha processor: parsing (rules -> own model -> teacher), dedup, merchants, cash"
requires-python = ">=3.12,<3.13"
dependencies = [
    "kharcha-common",
    "litellm>=1.55",
]

[project.scripts]
kharcha-processor = "kharcha_processor.main:run"

[tool.uv.sources]
kharcha-common = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kharcha_processor"]
